[project]
name = "langgraph-marketing-automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langgraph>=0.2,<0.3",
    "psycopg2-binary>=2.9.12",
    "structlog>=25.5.0",
    "parallel-web>=1.3.0,<2.0.0",
    "celery>=5.3.0",
    "flower>=2.0.0",
    "uvicorn>=0.29.0",
    "fastapi>=0.110.0",
    "redis>=7.4.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.29",
    "llama-index-core>=0.14.22",
    "llama-index-vector-stores-postgres>=0.8.1",
    "dotenv>=0.9.9",
    "pymupdf4llm>=1.27.2.3",
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.1",
    "email-validator>=2.3.0",
    "pydantic[email]>=2.13.4",
    "langchain-google-genai>=2.0,<3.0",
    "google-generativeai>=0.8",
    "google-cloud-aiplatform>=1.81.0",
    "celery-types>=0.26.0",
    "opik>=2.2.52",
]

[dependency-groups]
# Optional: local, third-party embedding fallback (EmbeddingPort ->
# FastEmbedEmbedding). Not installed by default — the default embedding
# model is Google's text-embedding-004.
offline = [
    "llama-index-embeddings-fastembed>=0.6.0",
    "fastembed>=0.4.2",
]
dev = [
    "deepeval==1.4.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "locust>=2.44.0",
]
deploy = [
    "google-cloud-aiplatform[agent_engines,langgraph]>=1.70.0",
]
