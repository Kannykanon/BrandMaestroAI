services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: pgvector/pgvector:pg16
    # Load the whole .env so model provider settings and API keys reach the
    # container. The explicit environment block below still wins.
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    # Load the whole .env so model provider settings and API keys reach the
    # container. The explicit environment block below still wins.
    env_file:
      - .env
    environment:
      PARALLEL_API_KEY: ${PARALLEL_API_KEY}
      POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - ./static:/app/static
      - fastembed_cache:/app/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker_generation:
    build: .
    command: celery -A celery_task worker --queues generation --concurrency 8 --loglevel info
    deploy:
      replicas: 2
    # Load the whole .env so model provider settings and API keys reach the
    # container. The explicit environment block below still wins.
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      PARALLEL_API_KEY: ${PARALLEL_API_KEY}
      POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - fastembed_cache:/app/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker_feedback:
    build: .
    command: celery -A celery_task worker --queues feedback --concurrency 8 --loglevel info
    # Load the whole .env so model provider settings and API keys reach the
    # container. The explicit environment block below still wins.
    env_file:
      - .env
    environment:
      PARALLEL_API_KEY: ${PARALLEL_API_KEY}
      POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - fastembed_cache:/app/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker_retraining:
    build: .
    command: celery -A celery_task worker --queues retraining --concurrency 2 --loglevel info
    # Load the whole .env so model provider settings and API keys reach the
    # container. The explicit environment block below still wins.
    env_file:
      - .env
    environment:
      PARALLEL_API_KEY: ${PARALLEL_API_KEY}
      POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - fastembed_cache:/app/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker_rag:
    build: .
    command: celery -A celery_task worker --queues rag_refresh --concurrency 2 --loglevel info
    # Load the whole .env so model provider settings and API keys reach the
    # container. The explicit environment block below still wins.
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      PARALLEL_API_KEY: ${PARALLEL_API_KEY}
      POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - fastembed_cache:/app/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build: .
    command: celery -A celery_task flower --port=5555
    ports:
      - "5555:5555"
    # Load the whole .env so model provider settings and API keys reach the
    # container. The explicit environment block below still wins.
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  # The local embedding model (EMBEDDING_PROVIDER=local), shared by every
  # service and kept across redeploys so it downloads once.
  fastembed_cache:
