name: Deploy BrandMaestro AI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # The EC2_* secret names are historical — the host is the Compute Engine
      # instance `brandmaestro` in us-central1-a. Renaming them here would
      # break the workflow unless the repository secrets were renamed in the
      # same change, so they stay as they are.
      - name: Deploy to the VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Fail on the first bad command. Without this a failed git pull
            # still ran the compose step and the job reported success, so a
            # deploy that shipped nothing was indistinguishable from one that
            # worked.
            set -e
            # ~ , not a hardcoded /home/ubuntu: the VM's login user is the
            # account the SSH key belongs to and its home is named after that
            # account, so the old absolute path did not exist and the deploy
            # died on this line before doing anything.
            cd ~/brandmaestro
            # fetch + reset, not pull. The box had drifted 40 commits behind
            # origin carrying ~3000 lines of uncommitted copies of newer files
            # — someone had copied files up instead of committing — and a pull
            # refuses to overwrite local modifications, so it could never have
            # recovered on its own. A deploy target holds no local edits by
            # definition: git is the source of truth and the box is a copy of
            # it. Anything not tracked (.env and the credentials in it) is
            # gitignored and survives this untouched.
            git fetch origin main
            git reset --hard origin/main
            # --build is what makes this a deploy rather than a restart.
            #
            # The compose services declare `build: .` and no `image:`, so
            # compose builds and runs an image it names itself. The previous
            # step here was a standalone `docker build -t brandmaestro-app .`,
            # which produced a tag nothing in docker-compose.yml refers to, and
            # `up --force-recreate` without --build recreates containers from
            # the image compose already had. So every service came back from
            # the last image compose itself built: new containers, old code.
            docker compose up -d --build --force-recreate \
              api worker_generation worker_feedback worker_retraining worker_rag flower
