# Render Blueprint — provisions the whole stack from this repo.
#
#   Render Dashboard -> New -> Blueprint -> point at this repository.
#
# Three services instead of the five docker-compose runs, because Celery
# brokers on Redis rather than RabbitMQ (see celery_task.CELERY_BROKER_URL),
# and the worker shares a container with the API (see scripts/render_start.sh).
#
# Values marked sync:false are NOT in this file and must be set in the Render
# dashboard — they are credentials.

databases:
  - name: brandmaestro-postgres
    databaseName: brandmaestro
    user: brandmaestro
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: brandmaestro-redis
    plan: free
    # Brand Brain cache, Celery broker, result backend and the generation
    # stream all share this instance.
    ipAllowList: []
    maxmemoryPolicy: noeviction   # a Celery broker must not drop queued tasks

  - type: web
    name: brandmaestro-api
    runtime: docker
    dockerfilePath: ./dockerfile
    plan: free
    healthCheckPath: /health
    # uvicorn only. Generation runs in the worker service below.
    #
    # Measured on the built image under a 512MB limit: uvicorn holds ~347MB
    # and a Celery worker ~350MB, so the two together idle at ~486MB of 512
    # and are killed once a generation loads on top. Split, each fits its own
    # instance with headroom — which is also the shape docker-compose uses.
    dockerCommand: sh -c "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # ---- datastores (wired automatically from the resources above) ----
      - key: POSTGRES_URI
        fromDatabase:
          name: brandmaestro-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: brandmaestro-redis
          type: keyvalue
          property: connectionString

      # ---- model backend: Vertex AI on Google Cloud ----
      - key: LLM_PROVIDER
        value: vertex_ai
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LOCATION
        value: us-central1
      - key: PROJECT_ID
        sync: false          # your Google Cloud project id
      # Application Default Credentials cannot exist here — no browser, no
      # gcloud. Upload the service account JSON as a Render Secret File named
      # service-account.json and point this at it.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json

      # ---- partner requirement ----
      - key: PARALLEL_API_KEY
        sync: false

      # ---- application ----
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: FRONTEND_URL
        sync: false          # origin allowed by CORS
      # Measured on the built image: uvicorn ~347MB RSS, the Celery main and
      # forked worker ~167MB and ~192MB (largely shared via fork). At
      # concurrency 2 the container idles at 590MB, over the 512MB a free or
      # starter instance gets, and dies on boot. At 1 it idles at ~486MB —
      # inside the limit, but with little headroom for a generation.
      #
      # If this OOMs under load, split the worker out rather than raising the
      # concurrency: run `celery -A celery_task worker` as its own Render
      # Background Worker against the same Key Value instance, and drop
      # dockerCommand here so the web service runs uvicorn alone. Each process
      # then gets its own memory limit, which is the shape docker-compose uses.
      - key: CELERY_CONCURRENCY
        value: "1"

      # ---- optional tracing; leave unset to disable ----
      - key: OPIK_API_KEY
        sync: false
      - key: OPIK_WORKSPACE
        sync: false
      - key: OPIK_PROJECT_NAME
        value: brandmaestro-ai

  - type: worker
    name: brandmaestro-worker
    runtime: docker
    dockerfilePath: ./dockerfile
    # Background workers have no free plan on Render. This is the one paid
    # component; the API, Postgres and Key Value all run on free instances.
    plan: starter
    dockerCommand: sh -c "celery -A celery_task worker --queues generation,feedback,retraining,rag_refresh --concurrency 1 --loglevel info"
    envVars:
      # Same datastores as the API — the queue only works if both ends share
      # one broker, and the Brand Brain cache is shared deliberately.
      - key: POSTGRES_URI
        fromDatabase:
          name: brandmaestro-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: brandmaestro-redis
          type: keyvalue
          property: connectionString

      - key: LLM_PROVIDER
        value: vertex_ai
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LOCATION
        value: us-central1
      - key: PROJECT_ID
        sync: false
      # Upload the same service account JSON as a Secret File on this service
      # too; secret files are per-service on Render.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/service-account.json
      - key: PARALLEL_API_KEY
        sync: false

      # Must match the API's value: tokens signed by one are read by the other.
      - key: SECRET_KEY
        fromService:
          name: brandmaestro-api
          type: web
          envVarKey: SECRET_KEY
      - key: ALGORITHM
        value: HS256

      - key: OPIK_API_KEY
        sync: false
      - key: OPIK_WORKSPACE
        sync: false
      - key: OPIK_PROJECT_NAME
        value: brandmaestro-ai
